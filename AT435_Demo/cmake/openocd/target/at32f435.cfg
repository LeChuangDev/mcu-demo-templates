# =====================================================================
#  at32f435.cfg —— AT32F435 的 OpenOCD target 包装
#
#  ★ 重要：主线 OpenOCD（0.12 / openocd.org）虽然源码里已带 artery flash
#    驱动（支持 F435/F437），但发布包的 tcl/target 下【没有】at32*.cfg，
#    直接用 stm32f4x.cfg 烧录会因 Flash 控制器不同而失败。
#    必须使用雅特力官方 OpenOCD_Artery（去官网"第三方编程工具"下载，
#    或 https://github.com/ArteryTek 下的 OpenOCD_Artery 仓库）。
#
#  ★ 文件命名版本差异（踩坑记录）★
#    雅特力 OpenOCD 不同发布版的 target 配置粒度不一样：
#    - 老版本（如本机 OpenOCD 0.11.0-00006-gbec841d3f, 2022-09-11）：
#      按系列命名：at32f435xx.cfg / at32f437xx.cfg
#      高密度专用：at32f435xM.cfg / at32f437xM.cfg（仅 M=4032K）
#      没有 at32f435xC/xD/xG.cfg 这种按密度的命名！
#    - 新版本可能改为按密度命名 at32f435xC/xD/xG/xM.cfg
#    本工程用的是老命名风格，改用新版 openocd 时改下面 source 路径。
#
#  用法：configure 时用 -DOPENOCD_EXECUTABLE=C:/path/OpenOCD_Artery/bin/openocd.exe
#        指定雅特力版可执行文件（PATH 里的同名程序不会被重复查找，
#        命令行 -D 优先级最高）。
#
#  换芯片系列时改下面 source 的文件名：
#    AT32F435xx -> at32f435xx.cfg   AT32F437xx -> at32f437xx.cfg
#    高密度 M    -> at32f435xM.cfg   高密度 M 437 -> at32f437xM.cfg
# =====================================================================
source [find target/at32f435xx.cfg]
