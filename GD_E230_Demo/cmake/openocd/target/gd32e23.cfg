# ============================================================
#  GD32E23x 系列（GD32E230/231/235）芯片层：内核识别 + Flash 驱动
#
#  OpenOCD 0.12 起自带 target/gd32e23x.cfg：
#    - Cortex-M23 内核（SWD only，没有 JTAG）
#    - stm32f1x Flash 编程算法（GD32E23x 的 FMC 与 STM32F1 兼容）
#  这里只做一层包装：跳过 TAP ID 校验，兼容不同批次的 GD32E230。
#
#  立创·GD32E230C8T6 开发板通过外部 DAP-Link / ST-Link V2 的 SWD 烧录，
#  接线：3V3 / GND / SWDIO / SWCLK（+ 可选 NRST）。
# ============================================================
set CPUTAPID 0
source [find target/gd32e23x.cfg]
