# ============================================================
#  GD32F4 系列（GD32F407/427 等）芯片层：内核识别 + Flash 驱动
#
#  OpenOCD 官方目前没有 GD32F4 专用 target（Flash 算法只内置 stm32 系）。
#  GD32F4 与 STM32F4 同为 Cortex-M4、SW-DP ID 相同(0x2ba01477)、
#  Flash 控制器兼容，社区（PlatformIO Community GD32 平台等）通行做法是
#  直接复用 stm32f4x.cfg，并用 CPUTAPID=0 跳过 TAP ID 校验。
#  该组合在 CMSIS-DAP/DAPLink + GD32F407 上被广泛用于烧录。
#
#  若个别批次烧录失败，可升级到带 GD32F4 专用 flash 驱动的 OpenOCD 分支
#  （如 PlatformIO 的 tool-openocd-gd32）后再改本文件。
# ============================================================
set CPUTAPID 0
source [find target/gd32f4x.cfg]
# OpenOCD 自带的 F4 配置会做:
#   1. 识别 Cortex-M4 内核
#   2. 注册兼容的 gd32f4x Flash 编程算法
#   3. 默认 SWD 连接
