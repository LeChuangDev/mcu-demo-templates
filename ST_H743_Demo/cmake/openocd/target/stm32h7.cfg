# STM32H7 芯片层：内核识别 + Flash 驱动
source [find target/stm32h7x.cfg]
# OpenOCD 自带的 H7 配置会做:
#   1. 识别 Cortex-M7 内核（含双精度 FPU、L1 Cache）
#   2. 注册 STM32H7 的 Flash 编程算法（支持双 Bank 1MB/2MB 器件）
#   3. 默认 SWD 连接
#
# 本模板目标 STM32H743VG 是单核 H7（CM7 only），stm32h7x.cfg 会自动处理；
# 若以后换 H745/H747 这类双核器件，需要额外指定 CM4 核并分别烧录。
